<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isopan Logistic</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --isopan-blue: #00a8cc; 
            --isopan-dark: #005a76;
            --glass-bg: rgba(245, 250, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text: #0a2540; 
            --error-red: #ff3b30;
            --accent: #007397;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e0f2f7 0%, #b2ebf2 100%);
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(120px);
            opacity: 0.6;
        }
        .blob {
            position: absolute;
            background: var(--isopan-blue);
            border-radius: 50%;
            animation: move 40s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100vw, 100vh); }
        }

        .app-container { 
            width: 100%; 
            max-width: 420px; 
            padding-bottom: 40px; 
            z-index: 1;
            flex: 1;
        }

        @media (min-width: 768px) {
            .app-container { max-width: 850px; }
            .grid-desktop { display: grid !important; grid-template-columns: 1fr 1fr; gap: 25px; }
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0 15px 0;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
            display: block;
        }

        .glass-card { 
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px; 
            padding: 28px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            margin-bottom: 25px;
        }
        
        .subtitle { 
            font-size: 12px; 
            color: var(--accent); 
            text-align: center;
            margin-bottom: 25px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .clear-btn { 
            background: rgba(255,255,255,0.4); 
            border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 12px; cursor: pointer; color: #555;
            display: flex; align-items: center; justify-content: center;
        }

        .lang-toggle { display: flex; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 12px; }
        .lang-btn { 
            background: transparent; border: none; padding: 6px 14px; border-radius: 9px; 
            font-size: 11px; font-weight: 800; cursor: pointer; color: #555; 
        }
        .lang-btn.active { background: white; color: var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        label { 
            display: block; 
            font-size: 15px; 
            color: var(--isopan-dark); 
            margin: 18px 0 8px 5px; 
            font-weight: 700; 
            letter-spacing: -0.3px;
        }
        
        select, input { 
            width: 100%; padding: 16px; border-radius: 16px; 
            border: 1px solid var(--glass-border);
            font-size: 16px; font-weight: 700; outline: none; box-sizing: border-box; 
            background: rgba(255,255,255,0.5); color: var(--text);
            -webkit-appearance: none; appearance: none;
        }
        select:focus, input:focus { background: white; border-color: var(--isopan-blue); }
        
        select:disabled, input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(0,0,0,0.05);
        }

        .truck-selector { display: flex; background: rgba(0,0,0,0.05); border-radius: 18px; padding: 5px; margin: 30px 0; }
        .truck-btn { 
            flex: 1; padding: 14px; border: none; border-radius: 14px; cursor: pointer; 
            font-weight: 800; color: #666; font-size: 12px; text-transform: uppercase; 
            background: transparent; transition: 0.3s;
        }
        .truck-btn.active { background: white; color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .partial-row-single { width: 100%; margin-bottom: 15px; }
        .partial-row-split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 15px; }

        #capacity-info { 
            font-size: 13px; 
            color: var(--isopan-dark); 
            margin-top: 10px; 
            font-weight: 700; 
            min-height: 15px;
            padding-left: 5px;
        }

        .button-area { 
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            width: 100%;
            margin-top: 30px;
            gap: 15px;
        }

        .calc-btn { 
            width: 100%; 
            max-width: 260px; 
            padding: 18px 25px; 
            background: var(--accent); 
            color: white; border: none; 
            border-radius: 20px; font-size: 17px; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 115, 151, 0.3);
            transition: all 0.3s ease;
        }

        .calc-btn:disabled { 
            background: #adb5bd;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-card { 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text); 
            border: 1px solid var(--glass-border);
            border-radius: 35px; 
            text-align: center; 
            margin-top: 25px; 
            opacity: 0; 
            transform: translateY(30px) scale(0.9); 
            pointer-events: none; 
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            height: 0; 
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .result-card.active { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
            pointer-events: auto; 
            height: auto; 
            padding: 40px 30px; 
        }
        
        .price { 
            font-size: 58px; 
            font-weight: 900; 
            margin: 10px 0; 
            color: var(--accent); 
        }

        .share-btn-discreet { 
            background: var(--accent); 
            color: white; 
            border: none;
            padding: 12px 24px; 
            border-radius: 14px; 
            font-size: 13px; 
            font-weight: 700; 
            width: auto; 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            margin-top: 25px; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 115, 151, 0.2);
        }

        footer { 
            margin-top: auto; 
            padding-bottom: 20px;
            text-align: center; 
            font-size: 11px; 
            color: var(--accent); 
            font-weight: 700; 
            opacity: 0.6; 
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
        <div class="blob" style="width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: -5s; background: #80deea;"></div>
    </div>

    <div class="app-container">
        <div class="logo-container">
            <img src="logo2.png" alt="Isopan Logo">
        </div>
        
        <div class="subtitle" id="txt-subtitle">Tarifas Corporativas</div>
        
        <div class="glass-card">
            <div class="top-bar">
                <button class="clear-btn" id="btn-clear" onclick="clearFields()" title="Limpiar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                </button>
                <div class="lang-toggle">
                    <button class="lang-btn active" id="lang-es" onclick="setLanguage('es')">ES</button>
                    <button class="lang-btn" id="lang-it" onclick="setLanguage('it')">IT</button>
                </div>
            </div>

            <div class="grid-desktop">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <div>
                        <label id="lbl-origin">Origen</label>
                        <select id="origin" onchange="handleOriginChange(); hideResult();"></select>
                    </div>
                    <div>
                        <label id="lbl-country">Destino</label>
                        <select id="country" onchange="loadData(); hideResult();"></select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:80px 1fr; gap:12px; align-items:end;">
                    <div>
                        <label id="lbl-code">Código</label>
                        <input type="tel" id="prov-code-input" maxlength="3" oninput="syncFromCode(); hideResult();">
                    </div>
                    <div>
                        <label id="lbl-province">Provincia</label>
                        <select id="province" onchange="syncToCode(); hideResult();"></select>
                    </div>
                </div>
            </div>

            <div class="truck-selector">
                <button class="truck-btn active" id="btn-full" onclick="setMode('full'); hideResult();">Tarifa camión completo</button>
                <button class="truck-btn" id="btn-partial" onclick="setMode('partial'); hideResult();">Tarifa camión parcial</button>
            </div>

            <div id="partial-fields" style="display:none;">
                <div class="partial-row-single">
                    <label id="lbl-panel">Familia producto</label>
                    <select id="family" onchange="this.classList.remove('error'); updateThickness(); hideResult();"></select>
                </div>
                <div class="partial-row-split">
                    <div>
                        <label id="lbl-thickness">Espesor</label>
                        <select id="thickness" onchange="this.classList.remove('error'); updateThicknessText(); hideResult();"></select>
                        <div id="capacity-info"></div>
                    </div>
                    <div>
                        <label id="lbl-m2">Cantidad (m²)</label>
                        <input type="number" id="m2" placeholder="0.00" inputmode="decimal" oninput="this.classList.remove('error'); hideResult();">
                    </div>
                </div>
            </div>

            <div class="button-area">
                <button class="calc-btn" id="main-calc-btn" onclick="calculate()">CALCULAR PRECIO</button>
            </div>
        </div>

        <div class="result-card" id="result">
            <div id="res-total" class="price">0,00 €</div>
            <div id="res-detail" style="font-size:14px; opacity:0.8; font-weight:700; color: #555;"></div>
            <button class="share-btn-discreet" id="btn-share" onclick="shareResult()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                <span id="txt-share">Compartir</span>
            </button>
        </div>
    </div>

    <footer>
        © <span id="year"></span> Isopan Ibérica · v 1.2
    </footer>

    <script>
        const SHEET_ID = '2PACX-1vRLWmNKL74-jgHbM0NIT79W7ShCxYfIKCvkK9bXbBJA0-NcRmBn6hg4RZxLLeaNLyYqnXwTlvLJLx7y';
        let currentData = [], mode = 'full', currentLang = 'es', dynamicCapacities = [];

        const translations = {
            es: { subtitle: "TARIFAS CORPORATIVAS", origin: "Origen", country: "Destino", code: "Código", province: "Provincia", full: "Tarifa camión completo", partial: "Tarifa camión parcial", m2: "Cantidad (m²)", panel: "Familia producto", thickness: "Espesor", calc: "CALCULAR PRECIO", share: "Compartir", loading: "CARGANDO...", cap_text: "Cap. media: ", select: "---", unit_cost: "Coste unitario: " },
            it: { subtitle: "TARIFFE CORPORATE", origin: "Partenza", country: "Destinazione", code: "Codice", province: "Provincia", full: "Tariffa mezzo completo", partial: "Tariffa mezzo parziale", m2: "Quantità (m²)", panel: "Famiglia productos", thickness: "Spessore", calc: "CALCOLA PREZZO", share: "Condividi", loading: "CARICAMENTO...", cap_text: "Cap. media: ", select: "---", unit_cost: "Costo unitario: " }
        };

        const GIDS = { 'Ibérica': { 'España': '565861240', 'Francia': '1175847860', 'Portugal': '1612817192' }, 'Pozzolo': { 'Francia': '1123279553' } };
        const MAP_ES = { bloque1: { name: 'ISOBOX / ISOPARETE / FARMAFARM / FARMALUM', start: 4, sizes: [30, 35, 40, 50, 60, 80, 100, 120] }, bloque2: { name: 'ISOFROZEN / WALL / WALL PLISSE', start: 13, sizes: [80, 100, 120, 150, 200] }, bloque3: { name: 'ISOCOP / ISOTAP / ISOTEGO / ISOFIRE ROOF', start: 19, sizes: [30, 40, 50, 60, 80, 100, 120, 150, 200] } };
        const MAP_IT = { bloque1: { name: 'PANNELLI DI PARETE PIR / PUR', start: 4, sizes: [25, 30, 35, 40, 50, 60, 80, 100, 120, 150, 180, 200] }, bloque2: { name: 'PANNELLO DI COPERTURA PIR / PUR', start: 17, sizes: [15, 30, 40, 50, 60, 80, 100, 120] }, bloque3: { name: 'PANNELLI DI PARETE MW (Mineral Wool)', start: 26, sizes: [50, 60, 80, 100, 120, 150, 170, 200] }, bloque4: { name: 'PANNELLO DI COPERTURA MW (Mineral Wool)', start: 35, sizes: [50, 60, 80, 100, 120, 150, 170, 200] } };

        function hideResult() { document.getElementById('result').classList.remove('active'); }
        function formatNum(v, d=2) { return new Intl.NumberFormat('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v); }
        function cleanVal(v) { if(!v) return 0; let s = v.toString().replace(/["€\s]/g, '').trim(); if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (s.includes(',')) s = s.replace(',', '.'); return parseFloat(s) || 0; }

        function setLanguage(l) {
            currentLang = l; const t = translations[l];
            document.getElementById('lang-es').classList.toggle('active', l === 'es');
            document.getElementById('lang-it').classList.toggle('active', l === 'it');
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-origin').innerText = t.origin;
            document.getElementById('lbl-country').innerText = t.country;
            document.getElementById('lbl-code').innerText = t.code;
            document.getElementById('lbl-province').innerText = t.province;
            document.getElementById('btn-full').innerText = t.full;
            document.getElementById('btn-partial').innerText = t.partial;
            document.getElementById('lbl-m2').innerText = t.m2;
            document.getElementById('lbl-panel').innerText = t.panel;
            document.getElementById('lbl-thickness').innerText = t.thickness;
            document.getElementById('main-calc-btn').innerText = t.calc;
            document.getElementById('txt-share').innerText = t.share;
            updateThicknessText(); hideResult();
        }

        function handleOriginChange() {
            const origin = document.getElementById('origin').value;
            const countrySelect = document.getElementById('country'); countrySelect.innerHTML = '';
            Object.keys(GIDS[origin]).forEach(c => countrySelect.add(new Option(c, c)));
            const famSelect = document.getElementById('family'); famSelect.innerHTML = '';
            famSelect.add(new Option(translations[currentLang].select, "")); 
            const activeMap = origin === 'Ibérica' ? MAP_ES : MAP_IT;
            Object.keys(activeMap).forEach(k => famSelect.add(new Option(activeMap[k].name, k)));
            loadData();
        }

        async function loadData() {
            const bCalc = document.getElementById('main-calc-btn');
            const inputCode = document.getElementById('prov-code-input');
            const selectProv = document.getElementById('province');
            bCalc.disabled = true; inputCode.disabled = true; selectProv.disabled = true;
            bCalc.innerText = translations[currentLang].loading;
            try {
                const origin = document.getElementById('origin').value;
                const country = document.getElementById('country').value;
                const res = await fetch(`https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv&gid=${GIDS[origin][country]}`);
                const text = await res.text();
                const rows = text.split('\n').map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                dynamicCapacities = rows[1] ? rows[1].map(v => cleanVal(v)) : [];
                currentData = rows.filter(r => r.length > 5 && r[1] && !r[1].includes("PROVINCIA") && !r[1].includes("Capacidad"));
                const sel = document.getElementById('province'); sel.innerHTML = '';
                currentData.forEach(r => {
                    let code = r[0].replace(/"/g, '').trim().padStart(2, '0');
                    let opt = new Option(`${code} - ${r[1].replace(/"/g, '').trim()}`, r[1].replace(/"/g, '').trim());
                    opt.setAttribute('data-code', code); sel.add(opt);
                });
                syncToCode(); updateThickness();
            } catch (e) { console.error(e); } 
            finally { bCalc.disabled = false; inputCode.disabled = false; selectProv.disabled = false; bCalc.innerText = translations[currentLang].calc; }
        }

        function syncToCode() { const sel = document.getElementById('province'); document.getElementById('prov-code-input').value = sel.options[sel.selectedIndex]?.getAttribute('data-code') || ''; }
        function syncFromCode() { 
            const code = document.getElementById('prov-code-input').value.padStart(2, '0');
            const sel = document.getElementById('province');
            for(let i=0; i<sel.options.length; i++) if(sel.options[i].getAttribute('data-code') === code) { sel.selectedIndex = i; return; }
        }

        function updateThickness() {
            const activeMap = document.getElementById('origin').value === 'Ibérica' ? MAP_ES : MAP_IT;
            const sel = document.getElementById('thickness'); sel.innerHTML = '';
            sel.add(new Option(translations[currentLang].select, "")); 
            const famKey = document.getElementById('family').value;
            if (famKey && activeMap[famKey]) activeMap[famKey].sizes.forEach(s => sel.add(new Option(s + ' mm', s)));
            updateThicknessText();
        }

        function updateThicknessText() {
            const activeMap = document.getElementById('origin').value === 'Ibérica' ? MAP_ES : MAP_IT;
            const famKey = document.getElementById('family').value;
            const thicknessValue = document.getElementById('thickness').value;
            const infoDiv = document.getElementById('capacity-info');
            if (famKey && thicknessValue && activeMap[famKey] && dynamicCapacities.length > 0) {
                const columnIdx = activeMap[famKey].start + activeMap[famKey].sizes.indexOf(parseInt(thicknessValue));
                infoDiv.innerText = translations[currentLang].cap_text + formatNum(dynamicCapacities[columnIdx], 0) + " m²";
            } else infoDiv.innerText = "";
        }

        function setMode(m) { mode = m; document.getElementById('btn-full').classList.toggle('active', m === 'full'); document.getElementById('btn-partial').classList.toggle('active', m === 'partial'); document.getElementById('partial-fields').style.display = m === 'partial' ? 'block' : 'none'; hideResult(); }

        function calculate() {
            const row = currentData.find(r => r[1].replace(/"/g, '').trim() === document.getElementById('province').value);
            if(!row) return;
            let total = 0, detail = "";
            if(mode === 'full') { total = cleanVal(row[2]); detail = translations[currentLang].full; } 
            else {
                const m2El = document.getElementById('m2'), famEl = document.getElementById('family'), thickEl = document.getElementById('thickness');
                let hasError = false;
                if(!m2El.value || parseFloat(m2El.value) <= 0) { m2El.style.borderColor = 'var(--error-red)'; hasError = true; }
                if(!famEl.value) { famEl.style.borderColor = 'var(--error-red)'; hasError = true; }
                if(!thickEl.value) { thickEl.style.borderColor = 'var(--error-red)'; hasError = true; }
                if(hasError) return;
                const activeMap = document.getElementById('origin').value === 'Ibérica' ? MAP_ES : MAP_IT;
                const pM2 = cleanVal(row[activeMap[famEl.value].start + activeMap[famEl.value].sizes.indexOf(parseInt(thickEl.value))]);
                total = 150 + (parseFloat(m2El.value) * pM2);
                detail = `${translations[currentLang].unit_cost}${formatNum((150 / parseFloat(m2El.value)) + pM2)} €/m²`;
            }
            document.getElementById('res-total').innerText = formatNum(total) + ' €';
            document.getElementById('res-detail').innerText = detail;
            document.getElementById('result').classList.add('active');
        }

        function clearFields() { hideResult(); document.getElementById('m2').value = ''; document.getElementById('province').selectedIndex = 0; syncToCode(); }

        async function shareResult() {
            const origin = document.getElementById('origin').options[document.getElementById('origin').selectedIndex].text;
            const country = document.getElementById('country').value;
            const province = document.getElementById('province').value;
            const code = document.getElementById('prov-code-input').value;
            const total = document.getElementById('res-total').innerText;
            const detail = document.getElementById('res-detail').innerText;
            
            let shareText = `🚚 PRESUPUESTO LOGÍSTICA ISOPAN\n\n`;
            shareText += `Ruta: ${origin} a ${country}\n`;
            shareText += `Destino: ${code} - ${province}\n`;
            shareText += `Servicio: ${mode === 'full' ? 'Camión Completo' : 'Carga Parcial'}\n`;
            
            if (mode === 'partial') {
                const family = document.getElementById('family').options[document.getElementById('family').selectedIndex].text;
                const thickness = document.getElementById('thickness').value;
                const m2 = document.getElementById('m2').value;
                shareText += `Producto: ${family}\n`;
                shareText += `Espesor: ${thickness} mm\n`;
                shareText += `Cantidad: ${m2} m²\n`;
                shareText += `${detail}\n`;
            }
            
            shareText += `\nTOTAL ESTIMADO: ${total}\n`;

            if (navigator.share) { 
                try { await navigator.share({ title: 'Presupuesto Logística Isopan', text: shareText }); } catch (err) {} 
            } else { 
                navigator.clipboard.writeText(shareText); 
                alert(currentLang === 'es' ? "Copiado al portapapeles" : "Copiato negli appunti"); 
            }
        }

        document.getElementById('year').textContent = new Date().getFullYear();
        const originSelect = document.getElementById('origin');
        ['Ibérica', 'Pozzolo'].forEach(o => originSelect.add(new Option(`Isopan ${o}`, o)));
        setLanguage('es'); handleOriginChange();
    </script>
</body>
</html>
